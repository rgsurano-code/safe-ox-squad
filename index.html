<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06100b"><link rel="manifest" href="manifest.webmanifest"><title>Safe - OX Squad v0.3</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#050907;color:#eafff2;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#173a28,#050907 68%)}.card{width:min(92vw,460px);padding:24px;border:1px solid #54f59b66;border-radius:22px;background:#08120df5}.logo{font-size:30px;font-weight:900}.green{color:#baffd5}.sub,.small{color:#91a99d}.sub{margin:7px 0 18px}.small{font-size:11px}.big,.btn{border:1px solid #69ffb355;border-radius:12px;background:#0d2117;color:#eafff4;font-weight:800}.big{width:100%;padding:15px;margin:6px 0}.field{width:100%;padding:13px;border-radius:11px;border:1px solid #ffffff22;background:#040906;color:white;margin:6px 0 10px}#game{display:none;position:absolute;inset:0}#map{position:absolute;inset:0;overflow:hidden;background:#1a3021;touch-action:none}#world{position:absolute;width:1400px;height:900px;transform-origin:0 0}.top{position:absolute;top:8px;left:8px;right:8px;z-index:20;display:flex;justify-content:space-between;pointer-events:none}.hud{pointer-events:auto;background:#06100ddd;border:1px solid #54f59b66;border-radius:12px;padding:8px 11px}.tools{position:absolute;right:8px;top:70px;z-index:25;display:flex;flex-direction:column;gap:7px}.tool{width:44px;height:44px;border:1px solid #67ffb455;border-radius:12px;background:#06100dea;color:white;font-size:19px}.tool.on{background:#165333}.bottom{position:absolute;left:7px;right:7px;bottom:8px;z-index:25;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.btn{padding:10px 12px;font-size:12px;background:#07120de8}.primary{background:#17643b}.danger{border-color:#ff665f66}.panel{position:absolute;z-index:40;left:8px;right:8px;bottom:65px;max-height:58vh;overflow:auto;background:#08130eef;border:1px solid #62ffad66;border-radius:17px;padding:14px;display:none;backdrop-filter:blur(14px)}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff12}.mapChoice{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mapChoice button{padding:10px;text-align:left;border:1px solid #ffffff1a;border-radius:10px;background:#0b1b13;color:#dfffea}.mapChoice .active{border-color:#65ffae;background:#123c27}#toast{position:absolute;z-index:60;top:68px;left:50%;transform:translateX(-50%);background:#07140ef0;border:1px solid #6affb477;border-radius:12px;padding:9px 13px;display:none;white-space:nowrap}.mode{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:22;background:#07140edb;border:1px solid #ffffff22;border-radius:20px;padding:6px 10px;font-size:11px;display:none}.marker{position:absolute;transform:translate(-50%,-50%);pointer-events:none;display:flex;align-items:center;justify-content:center;font-weight:900}.enemy{width:28px;height:28px;border-radius:50%;background:#ff4d4538;border:2px solid #ff665f}.squad{width:34px;height:34px;border-radius:50%;background:#4caaff38;border:2px solid #62b9ff}.safe{position:absolute;border:3px solid #e6ff9a;border-radius:50%;box-shadow:0 0 22px #dfff7a55;transform:translate(-50%,-50%);pointer-events:none}.safe.old{opacity:.28;border-width:2px}.heat{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#eaff8a72 0,#d8ff5b45 24%,#7dff9b1d 48%,transparent 72%)}.route{position:absolute;height:4px;border-radius:5px;transform-origin:0 50%;z-index:14}.g{background:#58ff9e}.y{background:#ffe45d}.r{background:#ff665f}.hidden{display:none!important}.air{width:16px;height:16px;border-radius:50%;background:white;border:2px solid #80bfff;position:absolute;transform:translate(-50%,-50%)}.bar{height:8px;background:#ffffff0e;border-radius:5px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:#c9ff77}
</style></head><body><div id="home" class="screen"><div class="card"><div class="logo">SAFE - <span class="green">OX SQUAD</span></div><div class="sub">v0.3 • versão recheada para testes</div><button class="big" onclick="start('IGL')">👑 SOU IGL</button><button class="big" onclick="guestScreen()">🟢 SOU CONVIDADO</button><div class="small">7 mapas • toque • Safes • avião • inimigos • squad • heatmap • regiões • 3 rotas • histórico local</div></div></div><div id="guest" class="screen" style="display:none"><div class="card"><div class="logo" style="font-size:24px">ENTRAR NA SALA</div><input id="code" class="field" placeholder="Código da sala • OX-7K4P"><input id="nick" class="field" placeholder="Seu nickname"><button class="big" onclick="start('GUEST')">ENTRAR</button><button class="big" onclick="back()">VOLTAR</button></div></div><div id="game"><div id="map"><div id="world"><div id="bg"></div><div id="heat"></div><div id="safes"></div><div id="routes"></div><div id="marks"></div></div></div><div class="top"><div class="hud"><b id="role">👑 IGL</b><div class="small">Sala <span id="room">OX-7K4P</span> • 1/8</div></div><div class="hud"><b id="phase">SAFE 1</b><div class="small"><span id="mapname">Erangel</span> • <span id="clock">00:00</span></div></div></div><div id="mode" class="mode"></div><div class="tools"><button class="tool on" onclick="layer('heat',this)">🌡️</button><button class="tool on" onclick="layer('safe',this)">🎯</button><button class="tool on" onclick="layer('enemy',this)">🔺</button><button class="tool on" onclick="layer('squad',this)">👥</button><button class="tool on" onclick="layer('route',this)">🛣️</button><button class="tool" onclick="panel('maps')">🗺️</button><button class="tool" onclick="panel('analysis')">📊</button><button class="tool" onclick="panel('history')">🕘</button></div><div id="toast"></div><div id="p" class="panel"></div><div class="bottom"><button id="airBtn" class="btn" onclick="mode('air')">✈️ Avião</button><button id="safeBtn" class="btn" onclick="mode('safe')">🎯 Safe</button><button class="btn" onclick="mode('enemy')">🔺 Inimigo</button><button id="squadBtn" class="btn" onclick="mode('squad')">👥 Squad</button><button id="confirmBtn" class="btn primary" onclick="confirmSafe()">✓ Confirmar Safe</button><button class="btn" onclick="panel('prob')">🌡️ Prob.</button><button class="btn" onclick="panel('routes')">🛣️ Rotas</button><button id="finishBtn" class="btn danger" onclick="finish()">FIM</button></div></div><script>
const maps={Erangel:['#507a8c','#597f4c','#8eae61'],Miramar:['#876f45','#b99a62','#d6bc7e'],Taego:['#607d72','#78986c','#a4b57b'],Rondo:['#557b76','#789c7d','#aac28d'],Vikendi:['#708a90','#8da7a0','#c4d2c1'],Sanhok:['#3e6f67','#5f9b63','#9bcf72'],Deston:['#4f7381','#6c8f73','#9fb483']};let S={role:'IGL',nick:'IGL',room:'OX-7K4P',map:'Erangel',mode:null,scale:1,ox:0,oy:0,down:false,sx:0,sy:0,sox:0,soy:0,temp:null,safes:[],enemies:[],air:[],squad:{x:700,y:450},routes:[],selected:null,layers:{heat:true,safe:true,enemy:true,squad:true,route:true},start:Date.now()};const world=document.getElementById('world'),mapEl=document.getElementById('map');
function start(r){S.role=r;if(r==='GUEST'){S.nick=document.getElementById('nick').value||'Convidado';S.room=document.getElementById('code').value||'OX-7K4P'}home.style.display='none';guest.style.display='none';game.style.display='block';document.getElementById('role').textContent=(r==='IGL'?'👑 ':'🟢 ')+S.nick;document.getElementById('room').textContent=S.room;['airBtn','safeBtn','squadBtn','confirmBtn','finishBtn'].forEach(x=>document.getElementById(x).classList.toggle('hidden',r==='GUEST'));drawMap();fit();toast('Sala pronta • '+S.map)}function guestScreen(){home.style.display='none';guest.style.display='flex'}function back(){guest.style.display='none';home.style.display='flex'}function fit(){S.scale=Math.max(.58,Math.min(1,Math.min(innerWidth/1400,innerHeight/900)*1.08));S.ox=(innerWidth-1400*S.scale)/2;S.oy=(innerHeight-900*S.scale)/2;render()}function render(){world.style.transform=`translate(${S.ox}px,${S.oy}px) scale(${S.scale})`}
function drawMap(){let [w,l,a]=maps[S.map],svg=`<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg"><rect width="1400" height="900" fill="${l}"/><path d="M0 0H270C360 110 210 220 350 330C440 410 370 520 500 590C600 650 550 780 650 900H0Z" fill="${w}"/><path d="M1400 0H1120C1040 130 1200 200 1080 310C980 400 1130 500 1010 590C920 680 1000 790 900 900H1400Z" fill="${w}" opacity=".9"/>`;for(let i=0;i<8;i++){let x=180+(i*173)%1050,y=130+(i*97)%650,r=70+(i%3)*35;svg+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${a}" opacity=".18"/><circle cx="${x+35}" cy="${y-15}" r="${r*.45}" fill="#31543b" opacity=".22"/>`}let roads=[[80,720,1320,180],[120,160,1150,610],[420,60,900,820]];for(let q of roads)svg+=`<line x1="${q[0]}" y1="${q[1]}" x2="${q[2]}" y2="${q[3]}" stroke="#ded49b" stroke-width="15" opacity=".32"/><line x1="${q[0]}" y1="${q[1]}" x2="${q[2]}" y2="${q[3]}" stroke="#56634e" stroke-width="5"/>`;for(let x=100;x<1400;x+=100)svg+=`<line x1="${x}" y1="0" x2="${x}" y2="900" stroke="white" stroke-opacity=".045"/>`;for(let y=100;y<900;y+=100)svg+=`<line x1="0" y1="${y}" x2="1400" y2="${y}" stroke="white" stroke-opacity=".045"/>`;svg+=`<text x="35" y="45" fill="white" fill-opacity=".65" font-size="22" font-weight="bold">${S.map.toUpperCase()} • TACTICAL TEST MAP</text></svg>`;document.getElementById('bg').innerHTML=svg;renderState()}
function point(e){let r=mapEl.getBoundingClientRect();return{x:(e.clientX-r.left-S.ox)/S.scale,y:(e.clientY-r.top-S.oy)/S.scale}}function mode(m){if(S.role==='GUEST'&&['air','safe','squad'].includes(m))return toast('Função exclusiva do IGL');S.mode=S.mode===m?null:m;document.getElementById('mode').textContent={air:'✈️ Arraste a rota do avião',safe:'🎯 Arraste para desenhar a Safe',enemy:'🔺 Toque para marcar inimigo',squad:'👥 Arraste para mover o squad'}[m]||'';document.getElementById('mode').style.display=S.mode?'block':'none';toast(S.mode?'Modo ativo':'Modo encerrado')}
mapEl.addEventListener('pointerdown',e=>{S.down=true;S.sx=e.clientX;S.sy=e.clientY;S.sox=S.ox;S.soy=S.oy;mapEl.setPointerCapture(e.pointerId);S.temp=point(e);if(S.mode==='enemy'){S.enemies.push({...S.temp,who:S.nick});S.down=false;renderState();toast('Inimigo marcado')}});mapEl.addEventListener('pointermove',e=>{if(!S.down)return;if(!S.mode){S.ox=S.sox+e.clientX-S.sx;S.oy=S.soy+e.clientY-S.sy;render()}else{S.temp2=point(e);if(S.mode==='squad'&&S.role==='IGL'){S.squad=S.temp2;renderState()}}});mapEl.addEventListener('pointerup',e=>{if(!S.down)return;S.down=false;let p=point(e);if(S.mode==='safe'){let r=Math.max(55,Math.hypot(p.x-S.temp.x,p.y-S.temp.y));S.safes.push({x:S.temp.x,y:S.temp.y,r:r});S.mode=null;toast('Safe criada')}else if(S.mode==='air'){S.air.push({a:S.temp,b:p});S.mode=null;toast('Rota do avião registrada')}document.getElementById('mode').style.display=S.mode?'block':'none';renderState()});mapEl.addEventListener('wheel',e=>{e.preventDefault();S.scale=Math.max(.5,Math.min(2.2,S.scale*(e.deltaY<0?1.12:.89)));render()},{passive:false});
function renderState(){document.getElementById('heat').innerHTML=S.layers.heat?'<div class="heat" style="left:470px;top:170px;width:680px;height:560px"></div><div class="heat" style="left:800px;top:420px;width:380px;height:300px;opacity:.6"></div>':'';document.getElementById('safes').innerHTML=S.layers.safe?S.safes.map((q,i)=>`<div class="safe ${i<S.safes.length-1?'old':''}" style="left:${q.x}px;top:${q.y}px;width:${q.r*2}px;height:${q.r*1.65}px"></div>`).join(''):'';let m='';if(S.layers.enemy)S.enemies.forEach(q=>m+=`<div class="marker enemy" style="left:${q.x}px;top:${q.y}px">!</div>`);if(S.layers.squad)m+=`<div class="marker squad" style="left:${S.squad.x}px;top:${S.squad.y}px">👥</div>`;if(S.air.length)S.air.forEach(q=>m+=`<div class="air" style="left:${q.a.x}px;top:${q.a.y}px"></div><div class="air" style="left:${q.b.x}px;top:${q.b.y}px"></div>`);document.getElementById('marks').innerHTML=m;document.getElementById('routes').innerHTML=S.layers.route?S.routes.map((q,i)=>`<div class="route ${q.c} ${S.selected!==null&&S.selected!==i?'hidden':''}" style="left:${q.a.x}px;top:${q.a.y}px;width:${Math.hypot(q.b.x-q.a.x,q.b.y-q.a.y)}px;transform:rotate(${Math.atan2(q.b.y-q.a.y,q.b.x-q.a.x)}rad)"></div>`).join(''):'';document.getElementById('phase').textContent='SAFE '+Math.max(1,S.safes.length);render();localStorage.setItem('ox_state',JSON.stringify(S))}function layer(k,b){S.layers[k]=!S.layers[k];b.classList.toggle('on',S.layers[k]);renderState()}
function panel(t){let p=document.getElementById('p');p.style.display='block';if(t==='maps')p.innerHTML='<h3>🗺️ Mapas</h3><div class="mapChoice">'+Object.keys(maps).map(x=>`<button class="${x===S.map?'active':''}" onclick="pickMap('${x}')">${x}</button>`).join('')+'</div><br><button class="btn" onclick="closeP()">FECHAR</button>';if(t==='prob')p.innerHTML='<h3>🌡️ Próxima Safe</h3>'+[['Centro/Leste',28],['Oeste',18],['Norte',15],['Sudoeste',14],['Outras',25]].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}%</b></div><div class="bar"><i style="width:${x[1]*3.2}%"></i></div>`).join('')+'<p class="small">Valores demonstrativos nesta versão. Depois serão calculados pelo modelo real.</p><button class="btn" onclick="closeP()">FECHAR</button>';if(t==='analysis')p.innerHTML='<h3>📊 Análise tática</h3><div class="row"><span>Elevação favorável</span><b>72%</b></div><div class="row"><span>Cobertura</span><b>68%</b></div><div class="row"><span>Estradas</span><b>61%</b></div><div class="row"><span>Exposição</span><b>29%</b></div><div class="row"><span>Pressão provável</span><b>34%</b></div><p class="small">Interface demonstrativa; o cálculo real virá dos dados de terreno e histórico.</p><button class="btn" onclick="closeP()">FECHAR</button>';if(t==='routes'){makeRoutes();p.innerHTML='<h3>🛣️ 3 rotas</h3><p class="small">Toque numa opção para manter somente aquela rota.</p><div class="row"><button class="btn" onclick="pickRoute(0)">🟢 Mais segura</button><button class="btn" onclick="pickRoute(1)">🟡 Alternativa</button><button class="btn" onclick="pickRoute(2)">🔴 Alto risco</button></div><div class="row"><span>Cobertura</span><b>68%</b></div><div class="row"><span>Elevação</span><b>72%</b></div><div class="row"><span>Estradas</span><b>61%</b></div><button class="btn" onclick="closeP()">FECHAR</button>'};if(t==='history'){let h=JSON.parse(localStorage.getItem('ox_hist')||'[]');p.innerHTML='<h3>🕘 Histórico</h3>'+(h.length?h.map((x,i)=>`<div class="row"><span>${i+1}. ${x.map}<br><span class="small">${x.date}</span></span><b>${x.safes} Safes<br>${x.enemies} inimigos</b></div>`).join(''):'<p class="small">Nenhuma partida salva.</p>')+'<button class="btn" onclick="closeP()">FECHAR</button>'}}function closeP(){document.getElementById('p').style.display='none'}function pickMap(x){S.map=x;S.safes=[];S.enemies=[];S.air=[];S.routes=[];S.selected=null;drawMap();closeP();toast('Mapa alterado: '+x)}function makeRoutes(){S.routes=[{a:{...S.squad},b:{x:1040,y:280},c:'g'},{a:{...S.squad},b:{x:1130,y:500},c:'y'},{a:{...S.squad},b:{x:900,y:740},c:'r'}];S.selected=null;renderState()}function pickRoute(i){S.selected=i;renderState();closeP();toast('Rota selecionada')}function confirmSafe(){if(S.role==='GUEST')return;toast('Safe confirmada • probabilidades atualizadas');panel('prob')}function finish(){let h=JSON.parse(localStorage.getItem('ox_hist')||'[]');h.unshift({date:new Date().toLocaleString('pt-BR'),map:S.map,safes:S.safes.length,enemies:S.enemies.length});localStorage.setItem('ox_hist',JSON.stringify(h.slice(0,20)));toast('Partida guardada localmente')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1800)}setInterval(()=>{let s=Math.floor((Date.now()-S.start)/1000);document.getElementById('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);window.onresize=render;
</script></body></html>
